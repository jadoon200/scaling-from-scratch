name: tests

on:
  push:
  pull_request:

jobs:
  portable:
    # macOS arm64 runner: MLX installs but has no Metal GPU for compute. The
    # quantization math is CPU-runnable, so the full suite runs here.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run portable tests (CPU)
        run: pytest -m "not gpu" -v
