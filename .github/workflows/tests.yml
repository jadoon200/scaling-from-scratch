name: tests

on:
  push:
  pull_request:

jobs:
  portable:
    # macOS arm64 runner: MLX installs, but GitHub's VMs have no Metal GPU for
    # compute, so the custom-kernel tests (@gpu) can't run here. CI runs the
    # portable tier — sanity checks on the reference implementations. The kernel
    # vs reference tests run locally on Apple Silicon (see README).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run portable tests (CPU)
        run: pytest -m "not gpu" -v
