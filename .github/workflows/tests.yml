name: tests

on:
  push:
    branches: [mlx-tiny-transformer]
  pull_request:
  workflow_dispatch:

# macOS runners bill at a 10x minute multiplier, so don't fire on every
# feature-branch push — only the default branch, PRs, and manual dispatch — and
# cancel superseded runs so rapid pushes don't stack.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    # GitHub's macOS runners are Apple Silicon (arm64) so MLX installs, but they
    # have no Metal GPU for compute — so we run only the portable (CPU) tier.
    # The @gpu kernel tests run locally on Apple Silicon (see README).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run portable tests (CPU)
        run: pytest -m "not gpu" -v
